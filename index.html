<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Dimensión Estelar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #03000a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(110, 30, 140, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(40, 20, 100, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(10, 5, 25, 0.9) 0%, #03000a 100%);
            overflow: hidden;
            height: 100vh;
        }

        /* Estrellas normales de fondo */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.7); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .star-bg {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        /* Estrellas interactivas */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .interactive-star {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px rgba(217, 70, 239, 0.4);
            animation: subtle-pulse var(--pulse-duration) infinite ease-in-out;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        .interactive-star:hover {
            transform: scale(2.2);
            box-shadow: 0 0 12px #fff, 0 0 25px #ec4899;
        }
    </style>
</head>
<body class="relative flex items-center justify-center text-white select-none">

    <!-- Fondo estelar profundo -->
    <div id="universe" class="absolute inset-0 pointer-events-none"></div>

    <!-- Contenedor de las estrellas interactivas -->
    <div id="galaxy-map" class="absolute inset-0"></div>

    <!-- Ventana Modal de Mensajes y Canciones -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-purple-950/85 border border-purple-500/40 p-6 md:p-8 rounded-2xl max-w-md w-full mx-4 shadow-[0_0_40px_rgba(168,85,247,0.4)] text-center relative">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-purple-300 hover:text-white text-xl font-bold">&times;</button>
            <h2 id="modal-title" class="text-2xl font-bold text-pink-200 mb-2 tracking-wide"></h2>
            <p id="modal-message" class="text-purple-100/90 text-sm md:text-base mb-4 leading-relaxed"></p>
            
            <div id="song-title" class="text-xs font-semibold text-pink-300 mb-2"></div>

            <!-- Reproductor de audio universal nativo que nunca falla -->
            <div id="audio-player-container" class="mb-5 flex justify-center"></div>

            <button onclick="cerrarModal()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium px-6 py-2 rounded-full transition shadow-lg">
                Volver al cosmos
            </button>
        </div>
    </div>

    <script>
        // 1. Generar estrellas de fondo
        const universe = document.getElementById('universe');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.classList.add('star-bg');
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            const size = Math.random() * 2 + 0.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            universe.appendChild(star);
        }

        // 2. Repertorio con enlaces de audio estables y directos
        const repertorioCanciones = [
            { nombre: "Melodía Estelar I", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", mensaje: "El universo es enorme, pero coincidir con vos es lo más increíble de todo." },
            { nombre: "Melodía Estelar II", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", mensaje: "Recordá que tu luz brilla más fuerte que cualquier estrella en este cielo." },
            { nombre: "Melodía Estelar III", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", mensaje: "Un pequeño recordatorio de que sos capaz de lograr todo lo que te proponés." },
            { nombre: "Melodía Estelar IV", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", mensaje: "Cada momento compartido se siente como viajar a otra galaxia." },
            { nombre: "Melodía Estelar V", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", mensaje: "Incluso en los días nublados, tu energía ilumina todo a tu alrededor." },
            { nombre: "Melodía Estelar VI", audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", mensaje: "Gracias por hacer que este viaje esté lleno de risas y momentos únicos." }
        ];

        const galaxyMap = document.getElementById('galaxy-map');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const songTitle = document.getElementById('song-title');
        const audioPlayerContainer = document.getElementById('audio-player-container');

        // 3. Generar estrellas interactivas
        const totalEstrellasInteractivas = 65;

        for (let i = 0; i < totalEstrellasInteractivas; i++) {
            const el = document.createElement('div');
            el.classList.add('interactive-star');
            
            const x = Math.random() * 96 + 2;
            const y = Math.random() * 96 + 2;
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            el.style.setProperty('--pulse-duration', `${Math.random() * 2 + 2}s`);

            const item = repertorioCanciones[i % repertorioCanciones.length];
            const datosUnicos = {
                titulo: `Constelación #${i + 1}`,
                mensaje: item.mensaje,
                audioUrl: item.audioUrl,
                nombreCancion: item.nombre
            };

            el.addEventListener('click', () => {
                abrirModal(datosUnicos);
            });

            galaxyMap.appendChild(el);
        }

        function abrirModal(estrella) {
            modalTitle.innerText = estrella.titulo;
            modalMessage.innerText = estrella.mensaje;
            songTitle.innerText = `🎵 ${estrella.nombreCancion}`;
            
            // Creamos un elemento de audio nativo limpio que reproduce directo
            audioPlayerContainer.innerHTML = `
                <audio controls autoplay class="w-full">
                    <source src="${estrella.audioUrl}" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                </audio>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function cerrarModal() {
            modal.classList.add('opacity-0');
            audioPlayerContainer.innerHTML = '';
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
